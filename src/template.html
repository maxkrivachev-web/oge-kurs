<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ОГЭ-2027 Обществознание</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study: calm, clear, a bit warm for a 15-year-old
   IDEA the exam answer blank and a good school notebook: numbered cells, highlighter, margin notes
   PICTURE the exam map: 20 task cells, size by points, filled = written answer
   COLOUR white ground, ink, state blue as the lead, red only for traps, highlighter yellow for verbatim
   TYPE Golos Text (the Russian civic-services face) for everything, weights for contrast
   LAYOUT laptop: sticky module list left, one reading column; phone: top bar + drawer, single column */
:root{color-scheme:light;
--bg:#fbfcfe;
--ink:#1f2633;
--mute:#5f6878;
--line:#e4e9f2;
--soft:#f1f4f9;
--blue:#2b5be0;
--blue2:#22459f;
--red:#c8231a;
--def:#edf2ff;
--vb:#fff6d6;
--trap:#fff0ed;
--ex:#f3f5f8;
--ege:#f3efff;
--ok:#0e7a43;
--okbg:#e3f6ec;
--nobg:#ffe9e6}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.68 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
a{color:var(--blue)}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px max(16px,3vw);background:var(--bg);border-bottom:1px solid var(--line)}
.top .brand{font-weight:800;font-size:17px;text-decoration:none;color:var(--ink);letter-spacing:-.01em}
.top .brand span{color:var(--blue)}
.top .grow{flex:1}
.pbar{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);white-space:nowrap}
.pbar i{display:block;width:90px;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.pbar i b{display:block;height:100%;background:var(--blue);width:0}
.menu{display:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;min-height:44px;padding:0 14px;font:inherit;font-size:15px;font-weight:600}
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1240px;margin:0 auto}
.side{position:sticky;top:57px;align-self:start;max-height:calc(100vh - 57px);overflow:auto;padding:18px 14px 30px max(16px,2vw);border-right:1px solid var(--line)}
.side a{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:15px;line-height:1.3}
.side a .n{flex:none;width:24px;font-weight:800;color:var(--mute);font-variant-numeric:tabular-nums}
.side a .d{flex:none;margin-left:auto;font-size:12px;color:var(--ok);font-weight:700}
.side a:hover{background:var(--soft)}
.side a.on{background:var(--def);color:var(--blue2);font-weight:600}
.side a.on .n{color:var(--blue)}
.side h4{margin:16px 10px 6px;font-size:13px;color:var(--mute);font-weight:600}
main{padding:24px max(16px,4vw) 80px;max-width:780px}
.page{display:none}
.page.on{display:block}
h1{font-size:clamp(30px,5vw,46px);line-height:1.06;letter-spacing:-.02em;margin:6px 0 12px;text-wrap:balance}
h2{font-size:clamp(23px,3.2vw,29px);line-height:1.15;letter-spacing:-.01em;margin:44px 0 12px;padding-top:18px;border-top:1px solid var(--line);color:var(--blue2)}
h3{font-size:20px;line-height:1.25;margin:28px 0 8px}
p{margin:0 0 12px}
ul,ol{padding-left:22px;margin:0 0 12px}
li{margin:3px 0}
.lead{font-size:19px;color:var(--mute);max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:600;white-space:nowrap}
.chip.b{background:var(--def);color:var(--blue2)}
.c{border-radius:14px;padding:14px 16px 4px;margin:14px 0;background:var(--ex)}
.c .tag{display:inline-block;font-size:13px;font-weight:700;margin-bottom:6px;padding:2px 9px;border-radius:999px;background:var(--bg)}
.c.def{background:var(--def)}.c.def .tag{color:var(--blue)}
.c.vb{background:var(--vb)}.c.vb .tag{color:#7a5b00}
.c.trap{background:var(--trap)}.c.trap .tag{color:var(--red)}
.c.ex .tag{color:var(--mute)}
.c.ege{background:var(--ege)}.c.ege .tag{color:#5b35c9}
.c ul{margin-bottom:10px}
.mark{background:var(--vb);padding:0 3px;border-radius:3px}
.scroll{overflow-x:auto;margin:12px 0 16px}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.4}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font-weight:700;background:var(--soft)}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.fig{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto}
.fig.wide svg{max-width:760px}
.fig figcaption,.cap{font-size:14px;color:var(--mute);margin-top:6px}
svg text{font-family:"Golos Text",system-ui,sans-serif}
.steps{counter-reset:s;list-style:none;padding:0}
.steps>li{counter-increment:s;position:relative;padding:2px 0 8px 40px}
.steps>li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--def);color:var(--blue2);font-weight:800;font-size:15px;display:grid;place-items:center}
.task{border:1px solid var(--line);border-radius:14px;padding:14px 16px 6px;margin:16px 0}
.task .tn{font-weight:800;color:var(--blue)}
details{border-top:1px dashed var(--line);margin:8px 0 6px;padding-top:6px}
summary{cursor:pointer;font-weight:700;color:var(--blue);min-height:36px;display:flex;align-items:center}
summary::marker{color:var(--blue)}
details>div{padding:4px 0 6px}
.mc{border:1px solid var(--line);border-radius:14px;padding:12px 16px 4px;margin:12px 0}
.mc ol{list-style:none;padding:0;display:grid;gap:6px;counter-reset:o}
.mc ol li{counter-increment:o;border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 40px;position:relative;cursor:pointer;min-height:44px;margin:0}
.mc ol li::before{content:counter(o) ")";position:absolute;left:12px;font-weight:700;color:var(--mute)}
.mc ol li:hover{background:var(--soft)}
.mc ol li.ok{background:var(--okbg);border-color:var(--ok)}
.mc ol li.no{background:var(--nobg);border-color:var(--red)}
.ans{background:var(--soft);border-radius:10px;padding:10px 12px;margin:6px 0 10px}
.good{border-left:0;background:var(--okbg);border-radius:10px;padding:10px 12px;margin:8px 0}
.bad{background:var(--nobg);border-radius:10px;padding:10px 12px;margin:8px 0}
.good b:first-child,.bad b:first-child{display:block;font-size:14px}
.sheet{border:2px solid #c9d6f5;background:#fff;border-radius:16px;padding:16px 18px 6px;margin:16px 0}
.sheet h4{margin:10px 0 4px;font-size:16px}
.sheet ul{margin-bottom:8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin:12px 0}
.cols>div{background:var(--soft);border-radius:12px;padding:12px 14px 4px}
.cols>div h4{margin:0 0 6px;font-size:16px}
.train{background:var(--def);border-radius:14px;padding:14px 16px 6px;margin:14px 0}
.train a{font-weight:600}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;min-height:44px}
.ck input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--blue)}
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0}
.cell{border:2px solid #b9cbf6;border-radius:12px;padding:8px 8px 6px;background:var(--bg);color:var(--ink);text-align:left;cursor:pointer;font:inherit;min-height:84px;display:flex;flex-direction:column;gap:4px}
.cell .no{font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.cell .pts{display:flex;gap:3px}
.cell .pts i{width:10px;height:10px;border-radius:2px;background:var(--blue)}
.cell .lb{font-size:13px;line-height:1.2;color:var(--mute)}
.cell.w{background:var(--def);border-color:var(--blue)}
.cell.w .lb{color:var(--mute)}
.cell.w .no{color:var(--blue2)}

.cell.sel{outline:3px solid var(--blue2);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--mute)}
.legend span::before{content:"";display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid #b9cbf6;background:#fff;vertical-align:-2px;margin-right:6px}
.legend span.w::before{background:var(--def);border-color:var(--blue)}
.legend span.p::before{width:10px;height:10px;border:0;border-radius:2px;background:var(--blue);vertical-align:0}
.panel{border:1px solid var(--line);border-radius:14px;padding:14px 16px 6px;margin:8px 0 18px;background:var(--soft)}
.panel h3{margin:0 0 6px}
.sched{list-style:none;padding:0;margin:12px 0}
.sched>li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.sched .when{font-weight:800;font-size:16px;line-height:1.25;white-space:nowrap}
.ages>li{grid-template-columns:80px minmax(0,1fr)}
.ages .when{color:var(--blue2);font-size:18px}
.sched .when small{display:block;font-weight:500;color:var(--mute);font-size:13px}
.sched ul{margin:0;padding-left:18px}
.sched li li{font-size:15px}
.rep{color:var(--blue2);font-weight:600}
.big{font-size:clamp(34px,6vw,54px);font-weight:800;line-height:1;letter-spacing:-.02em}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:10px;margin:14px 0}
.stat>div{background:var(--soft);border-radius:12px;padding:12px 14px}
.stat small{display:block;color:var(--mute);font-size:14px;margin-top:4px}
.bars{margin:10px 0 4px}
.bars .row{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:8px;align-items:center;margin:3px 0;font-size:14px}
.bars .row .t{position:relative;height:22px;background:var(--soft);border-radius:4px;overflow:hidden}
.bars .row .t b{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bars .row .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.bars .q{font-weight:600;margin-top:10px;font-size:15px}
.bars .k{display:flex;gap:16px;font-size:14px;color:var(--mute);margin:6px 0}
.bars .k span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.photo{border-radius:14px;overflow:hidden;border:1px solid var(--line);margin:12px 0}
.photo .pic{background:var(--soft)}
.photo p{padding:10px 14px;margin:0;font-size:15px}
.txt{background:var(--soft);border-radius:14px;padding:16px 18px 6px;margin:12px 0;font-size:16px}
.txt p{text-indent:1.5em}
.foot{margin-top:50px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
.navpn{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.navpn a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:10px;background:var(--soft);text-decoration:none;font-weight:700}
.scrim{display:none}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
.toc a{display:inline-flex;align-items:center;min-height:36px;padding:4px 12px;border-radius:999px;background:var(--soft);color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}
.toc a:hover{background:var(--def);color:var(--blue2)}
.cont{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;margin:4px 0 8px}
#toTop{position:fixed;right:16px;bottom:16px;z-index:15;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--blue2);font:inherit;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(30,40,70,.12);display:none;cursor:pointer}
#toTop.on{display:inline-flex;align-items:center}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--blue2);font:inherit;font-size:15px;font-weight:700;cursor:pointer;margin:4px 6px 4px 0}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
textarea.code{width:100%;min-height:90px;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink);overflow-wrap:anywhere}
.gtools{position:sticky;top:57px;z-index:5;background:var(--bg);padding:10px 0 4px;border-bottom:1px solid var(--line)}
.gl{display:block;font-weight:600;font-size:15px;margin-bottom:4px}
#gq{width:100%;min-height:46px;font:inherit;font-size:16px;padding:8px 12px;border:1px solid #c9d6f5;border-radius:10px;background:#fff;color:var(--ink)}
.gself{border:0;padding:6px 0;min-height:auto;font-size:15px}
.gsec h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gmod{font-size:14px;font-weight:600}
.gsec dl{margin:0}
.gi{padding:9px 0;border-bottom:1px solid var(--line)}
.gi dt{display:inline;font-weight:700}
.gi dt::after{content:" - ";font-weight:400}
.gi dd{display:inline;margin:0}
.quiz .gi dd{display:none}
.quiz .gi dt{cursor:pointer;color:var(--blue2)}
.quiz .gi dt::after{content:" (показать)";font-weight:400;font-size:14px;color:var(--mute)}
.quiz .gi.show dd{display:inline}
.quiz .gi.show dt::after{content:" - ";font-size:inherit;color:inherit}
@media(max-width:999px){
.wrap{grid-template-columns:minmax(0,1fr)}
.menu{display:inline-flex;align-items:center}
.side{position:fixed;top:57px;left:0;bottom:0;width:min(86vw,320px);max-height:none;background:var(--bg);z-index:30;transform:translateX(-102%);transition:transform .2s;border-right:1px solid var(--line)}
body.nav .side{transform:none}
body.nav .scrim{display:block;position:fixed;inset:57px 0 0 0;background:rgba(0,0,0,.35);z-index:25}
.pbar i{width:56px}
}
@media(max-width:600px){
body{font-size:16px}
main{padding-top:16px}
.map{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cell{min-height:70px;padding:6px}
.cell .no{font-size:22px}
.cell .lb{display:none}
.sched>li{grid-template-columns:minmax(0,1fr);gap:4px}
table{font-size:13px}
th,td{padding:6px 5px}
.stack thead{display:none}
.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}
.stack td{display:block;border:0;padding:2px 0}
.stack td::before{content:attr(data-l);display:block;font-size:12px;color:var(--mute);font-weight:600}
.stack td.num{text-align:left}
.fig{margin-left:-16px;margin-right:-16px;border-radius:0;border-left:0;border-right:0;padding:8px 4px}
.fig figcaption{padding:0 12px}
.top .brand{font-size:15px}
}
@media(prefers-reduced-motion:reduce){.side{transition:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="top">
<button class="menu" id="menuBtn" aria-expanded="false" aria-controls="side">Модули</button>
<a class="brand" href="#start">ОГЭ-2027 <span>Обществознание</span></a>
<div class="grow"></div>
<div class="pbar" title="Отмечено пунктов чек-листа"><i><b id="pfill"></b></i><span id="ptext">0%</span></div>
</header>
<div class="scrim" id="scrim"></div>
<button id="toTop" type="button" aria-label="Наверх страницы">Наверх</button>
<div class="wrap">
<nav class="side" id="side" aria-label="Модули курса">
<!--NAV-->
</nav>
<main id="main">
<!--PAGES-->
</main>
</div>
<script>
{
const KEY='oge27-soc-v1';
let store={};
try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){store={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const pages=[...document.querySelectorAll('.page')];
const links=[...document.querySelectorAll('.side a')];
const body=document.body;
const menuBtn=document.getElementById('menuBtn');
function closeNav(){body.classList.remove('nav');menuBtn.setAttribute('aria-expanded','false')}
menuBtn.addEventListener('click',()=>{const o=body.classList.toggle('nav');menuBtn.setAttribute('aria-expanded',o?'true':'false')});
document.getElementById('scrim').addEventListener('click',closeNav);
document.querySelectorAll('.page').forEach(pg=>{
  if(!/^m\d+$/.test(pg.id))return;
  const hs=[...pg.querySelectorAll('h2')];
  hs.forEach((h,i)=>{if(!h.id)h.id=pg.id+'-'+(i+1)});
  const nav=document.createElement('nav');nav.className='toc';nav.setAttribute('aria-label','Разделы модуля');
  nav.innerHTML=hs.map(h=>'<a href="#'+h.id+'">'+h.textContent.replace(/^Теория\. /,'')+'</a>').join('');
  const lead=pg.querySelector('.lead');if(lead)lead.after(nav);
});
const titles={};links.forEach(a=>{const s=a.querySelectorAll('span');titles[a.getAttribute('href').slice(1)]=(s[0].textContent?s[0].textContent+'. ':'')+s[1].textContent});
function cont(){const el=document.getElementById('cont');if(!el)return;const l=store.__last;el.innerHTML=l&&titles[l]?'<a class="cont" href="#'+l+'">Продолжить: '+titles[l]+'</a>':'<a class="cont" href="#m0">Начать с модуля 0</a>'}
function route(){
  const id=(location.hash||'#start').slice(1);
  let pg=document.getElementById(id);
  let target=null;
  if(pg&&!pg.classList.contains('page')){target=pg;pg=pg.closest('.page')}
  if(!pg)pg=document.getElementById('start');
  pages.forEach(p=>p.classList.toggle('on',p===pg));
  links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+pg.id));
  closeNav();
  if(target){target.scrollIntoView()}else{window.scrollTo(0,0)}
  document.title=(pg.dataset.t?pg.dataset.t+' | ':'')+'ОГЭ-2027 Обществознание';
  if(/^m\d+$/.test(pg.id)&&store.__last!==pg.id){store.__last=pg.id;save()}
  if(pg.id==='start')cont();
}
const tt=document.getElementById('toTop');
window.addEventListener('scroll',()=>{tt.classList.toggle('on',window.scrollY>900)},{passive:true});
tt.addEventListener('click',()=>window.scrollTo(0,0));
window.addEventListener('hashchange',route);
const boxes=[...document.querySelectorAll('input[data-k]')];
function progress(){
  const n=boxes.length,d=boxes.filter(b=>b.checked).length;
  const p=n?Math.round(d*100/n):0;
  document.getElementById('pfill').style.width=p+'%';
  document.getElementById('ptext').textContent=p+'%';
  links.forEach(a=>{
    const id=a.getAttribute('href').slice(1);
    const bs=boxes.filter(b=>b.dataset.k.startsWith(id+'-'));
    const sp=a.querySelector('.d');
    if(sp)sp.textContent=bs.length?(bs.filter(b=>b.checked).length+'/'+bs.length):'';
  });
}
boxes.forEach(b=>{b.checked=!!store[b.dataset.k];b.addEventListener('change',()=>{store[b.dataset.k]=b.checked;save();progress()})});
document.querySelectorAll('.mc').forEach(q=>{
  const a=+q.dataset.a;
  q.querySelectorAll('ol li').forEach((li,i)=>{
    li.tabIndex=0;
    const pick=()=>{q.querySelectorAll('ol li').forEach(x=>x.classList.remove('ok','no'));li.classList.add(i+1===a?'ok':'no');if(i+1!==a){const r=q.querySelectorAll('ol li')[a-1];if(r)r.classList.add('ok')}const d=q.querySelector('details');if(d)d.open=true};
    li.addEventListener('click',pick);
    li.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}});
  });
});
const MAP=window.EXAM_MAP||[];
const mapEl=document.getElementById('examMap');
const panel=document.getElementById('mapPanel');
function showTask(t,btn){
  document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('sel',c===btn));
  panel.innerHTML='<h3>Задание '+t.n+'. '+t.name+'</h3><p><b>Формат:</b> '+t.fmt+'. <b>Баллы:</b> '+t.p+'.</p><p><b>Что проверяют:</b> '+t.what+'</p><p><b>Где в курсе:</b> '+t.mods.map(m=>'<a href="#'+m[0]+'">'+m[1]+'</a>').join(', ')+'</p>';
}
if(mapEl){
  mapEl.innerHTML=MAP.map((t,i)=>'<button class="cell'+(t.w?' w':'')+'" data-i="'+i+'" aria-label="Задание '+t.n+'"><span class="no">'+t.n+'</span><span class="pts">'+'<i></i>'.repeat(t.p)+'</span><span class="lb">'+t.short+'</span></button>').join('');
  mapEl.querySelectorAll('.cell').forEach(b=>b.addEventListener('click',()=>showTask(MAP[+b.dataset.i],b)));
  if(MAP.length)showTask(MAP[0],mapEl.querySelector('.cell'));
}
const tbl=document.getElementById('mapTable');
if(tbl){tbl.innerHTML=MAP.map(t=>'<tr><td class="num">'+t.n+'</td><td>'+t.name+'</td><td class="num">'+t.p+'</td><td>'+t.what+'</td><td>'+t.mods.map(m=>'<a href="#'+m[0]+'">'+m[1]+'</a>').join(', ')+'</td></tr>').join('')}
const tk=document.getElementById('taskChecks');
if(tk){tk.innerHTML=MAP.map(t=>'<label class="ck"><input type="checkbox" data-k="progress-t'+t.n+'"> <span><b>Задание '+t.n+'</b> ('+t.p+' б.): стабильно 85%+ на Решу ОГЭ / полный балл в пробнике</span></label>').join('');
  tk.querySelectorAll('input').forEach(b=>{boxes.push(b);b.checked=!!store[b.dataset.k];b.addEventListener('change',()=>{store[b.dataset.k]=b.checked;save();progress()})});}
document.getElementById('resetAll')?.addEventListener('click',()=>{const r=document.getElementById('resetAll');if(r.dataset.c!=='1'){r.dataset.c='1';r.textContent='Точно сбросить? Нажми еще раз';return}store={};save();boxes.forEach(b=>b.checked=false);progress();r.dataset.c='';r.textContent='Сбросить все отметки'});
const bShow=document.getElementById('bShow'),bCopy=document.getElementById('bCopy'),bOut=document.getElementById('bOut'),bIn=document.getElementById('bIn'),bRes=document.getElementById('bRes'),bMsg=document.getElementById('bMsg');
const enc=o=>'OGE27:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=t=>{t=t.trim();if(!t.startsWith('OGE27:'))throw 0;return JSON.parse(decodeURIComponent(escape(atob(t.slice(6)))))};
if(bShow){
  bShow.addEventListener('click',()=>{bOut.value=enc(store);bOut.hidden=false;bCopy.hidden=false;bOut.select()});
  bCopy.addEventListener('click',()=>{bOut.select();const done=()=>{bMsg.textContent='Код скопирован. Сохрани его в заметках или отправь себе.'};try{navigator.clipboard.writeText(bOut.value).then(done,()=>{bMsg.textContent='Скопируй код вручную: он уже выделен.'})}catch(e){bMsg.textContent='Скопируй код вручную: он уже выделен.'}});
  bRes.addEventListener('click',()=>{try{const o=dec(bIn.value);if(typeof o!=='object'||!o)throw 0;store=o;save();boxes.forEach(b=>b.checked=!!store[b.dataset.k]);progress();bMsg.textContent='Прогресс восстановлен.';bIn.value=''}catch(e){bMsg.textContent='Код не подошел. Проверь, что скопирован целиком, начиная с OGE27:'}});
}
progress();
route();
}
</script>
</body>
</html>
